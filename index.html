<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login dengan Cinta</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background">
    <div class="hearts"></div>
  </div>
  <div class="login-box">
    <h2>Masukkan Password</h2>
    <form onsubmit="return validatePassword(event)">
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Masuk</button>
    </form>
    <p id="error-message" style="color: red; margin-top: 10px;"></p>
  </div>

  <script>
    function validatePassword(event) {
      event.preventDefault(); // mencegah form dikirim langsung

      const passwordInput = document.getElementById("password");
      const errorMessage = document.getElementById("error-message");

      const correctPassword = "150824";

      if (passwordInput.value === correctPassword) {
        window.location.href = "welcome.html"; // redirect ke halaman selanjutnya
      } else {
        errorMessage.textContent = "Password salah. Coba lagi ya 💔";
        passwordInput.value = "";
        passwordInput.focus();
      }

      return false;
    }
  </script>
</body>
</html>
